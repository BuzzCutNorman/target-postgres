[project]
name = "target-postgres"
version = "0.1.0"
description = "`target-postgres` is a Singer target for postgres, built with the Meltano Singer SDK."
readme = "README.md"
authors = [{ name = "Dan Norman", email = "buzzcutnorman@gmail.com" }]
keywords = [
    "ELT",
    "postgres",
]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
license = "MIT"
license-files = [ "LICENSE.md" ]
requires-python = ">=3.9"
dependencies = [
    "singer-sdk[msgspec]~=0.46.4",
    "psycopg2>=2.9.9,<3",
    "psycopg[binary]>=3.2.9,<4",
]

[project.optional-dependencies]
s3 = ["fs-s3fs>=1.1.1,<2"]

[project.scripts]
target-postgres = "target_postgres.target:Targetpostgres.cli"

[dependency-groups]
dev = [
    { include-group = "test" },
]
test = [
    "pytest>=8",
    "singer-sdk[testing]~=0.46.4",
]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
plugins = "sqlmypy"

[tool.ruff]
src = ["target_postgres"]
target-version = "py39"

[tool.ruff.lint]
ignore = [
    "ANN101",  # missing-type-self
    "ANN102",  # missing-type-cls
    "COM812",  # missing-trailing-comma
    "ISC001",  # single-line-implicit-string-concatenation
]
select = ["ALL"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[build-system]
requires = [
    "hatchling>=1,<2",
]
build-backend = "hatchling.build"
